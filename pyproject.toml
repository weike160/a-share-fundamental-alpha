[project]
name = "a-share-fundamental-alpha"
version = "0.1.0"
description = "Quant research case study: fundamental event alpha in China A-shares (point-in-time, trading frictions, ML extension)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Weike (weike160)" }]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "akshare>=1.18",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
    # >=2.7 才包含 sm_120 (Blackwell / RTX 50 系) kernel
    "torch>=2.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "shap>=0.46",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*", "signals*", "factor*", "portfolio*", "execution*", "backtest*", "ml*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
